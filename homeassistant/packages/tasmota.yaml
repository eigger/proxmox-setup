# HA /config/packages/tasmota.yaml
# Athom Tasmota IR Remote — MQTT sensor·button (Topic: tasmota_ir)
# 문서: tasmota.md

mqtt:
  sensor:
    - device:
        identifiers: Athom-IRRemote
        manufacturer: Athom
        name: Tasmota IR Controller
        model: AR01
      name: IrReceived
      unique_id: tasmota_ir_received
      icon: mdi:download
      availability_topic: tele/tasmota_ir/LWT
      payload_available: Online
      payload_not_available: Offline
      state_topic: tele/tasmota_ir/RESULT
      value_template: >
        {% if value_json.IrReceived is defined and value_json.IrReceived.Data is defined %}
          {{ value_json.IrReceived.Data }}
        {% else %}
          N/A
        {% endif %}
      json_attributes_topic: tele/tasmota_ir/RESULT
      json_attributes_template: "{{ value_json.IrReceived | tojson }}"

