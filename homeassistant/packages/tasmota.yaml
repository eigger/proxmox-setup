  button:
    - device:
        identifiers: Balmuda-GreenFanS
        manufacturer: Balmuda
        name: GreenFanS
        model: EGF-1700-WG
      name: OnOff
      unique_id: tasmota_ir_balmuda_on_off
      icon: mdi:fan
      availability_topic: tele/tasmota_ir/LWT
      payload_available: Online
      payload_not_available: Offline
      command_topic: cmnd/tasmota_ir/irsend
      payload_press: '{"Protocol":"PANASONIC","Bits":48,"Data":"0x32427078807F","DataLSB":"0x4C420E1E01FE","Repeat":0}'
